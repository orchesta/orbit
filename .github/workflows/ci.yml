name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  # ─── Go Backend Tests ───────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd/orbit

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt

  # ─── Go Postgres Integration Tests ─────────────
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORBIT_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -tags integration ./internal/adapter/persistence/...

  # ─── React Frontend Build ──────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ─── Docker Build ──────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: orbit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── CLI image + self-scan ─────────────────────
  cli:
    name: CLI (self-scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.cli
          load: true
          push: false
          tags: orbit-cli:ci
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      # Scan this repo with its own CLI. A critical finding fails the job on purpose.
      # The image user (10001) cannot write into the runner-owned workspace, so run as
      # the runner's uid:gid; the report then lands in the workspace as the runner user.
      - name: Scan this repository
        run: |
          # Exit 2 is an error (e.g. osv.dev unreachable): retry once after 30s.
          # Exit 0 (clean) and 1 (threshold hit) pass straight through.
          for attempt in 1 2; do
            rc=0
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE":/src \
              orbit-cli:ci scan --path /src --fail-on critical --format sarif --out /src/orbit.sarif || rc=$?
            if [ "$rc" -ne 2 ] || [ "$attempt" -eq 2 ]; then
              exit "$rc"
            fi
            echo "scan failed with exit 2, retrying in 30s"
            sleep 30
          done

      # On exit 2 the CLI deletes --out, so the file may be missing.
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-sarif
          path: orbit.sarif
          if-no-files-found: warn
