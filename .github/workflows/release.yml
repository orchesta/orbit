name: Release

on:
  push:
    tags: ['v*']

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

jobs:
  binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*) echo "::error::tag '$TAG' contains '+' (build metadata); it is not a valid image tag. Use '-' instead."; exit 1 ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/orchesta/orbit/internal/buildinfo.Version=${TAG}" \
            -o "dist/orbit_${TAG}_${GOOS}_${GOARCH}${ext}" ./cmd/orbit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: orbit-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum orbit_* > checksums.txt && cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running a failed workflow must not fail on an existing release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=""
            # A tag with '-' (v1.2.0-rc1) is a prerelease.
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $flags
          fi

  images:
    name: Images (Docker Hub)
    runs-on: ubuntu-latest
    # Publish images only after the binaries and the release succeeded.
    needs: [release]
    permissions:
      contents: read
    steps:
      # Docker Hub credentials: repository secrets DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN (an access token with write access to orchestalabs/orbit
      # and orchestalabs/orbit-cli).
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The server image compiles under emulation for arm64 (apk in the runtime stage).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Prereleases (tag contains '-') get only their own tag, never 'latest'.
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*) echo "::error::tag '$TAG' contains '+'; not allowed"; exit 1 ;;
          esac
          server="docker.io/orchestalabs/orbit:${TAG}"
          cli="docker.io/orchestalabs/orbit-cli:${TAG}"
          case "$TAG" in
            *-*) ;;
            *) server="${server},docker.io/orchestalabs/orbit:latest"; cli="${cli},docker.io/orchestalabs/orbit-cli:latest" ;;
          esac
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "cli=${cli}" >> "$GITHUB_OUTPUT"

      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.server }}

      - name: CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.cli }}
