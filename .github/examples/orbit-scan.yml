name: Orbit scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  orbit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Orbit scan
        uses: aligoren/orbit@v1.0.0 # pin to a release tag, or better a full commit SHA
        with:
          fail-on: high
          version: v1.0.0

      # Runs even when the scan failed the build (exit 1), so findings still show up.
      # If the scan errored (exit 2) no report exists and the step is skipped by hashFiles.
      - name: Upload SARIF
        if: always() && hashFiles('orbit.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: orbit.sarif
