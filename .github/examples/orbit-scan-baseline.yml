# Pull requests fail only on findings they introduce; main records the baseline.
# See "New findings only, in CI" in the README.
name: Orbit scan (new findings only)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily: advisories published since the last push land in the baseline

permissions:
  contents: read

jobs:
  orbit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull requests restore the newest baseline saved on the base branch. The exact key
      # never exists; restore-keys picks the most recently created match.
      - name: Restore Orbit baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: orbit-baseline.json
          key: orbit-baseline-${{ github.run_id }}
          restore-keys: orbit-baseline-

      - name: Orbit scan
        uses: orchesta/orbit@v1.0.0 # pin to a release tag, or better a full commit SHA
        with:
          version: v1.0.0
          fail-on: high
          # Pull requests compare with the restored baseline. Other runs record a new one;
          # on main every finding is an existing one, so the action reports them as a
          # warning instead of failing (errors still fail).
          baseline: ${{ github.event_name == 'pull_request' && 'orbit-baseline.json' || '' }}
          baseline-output: ${{ github.event_name != 'pull_request' && 'orbit-baseline.json' || '' }}

      - name: Save Orbit baseline
        if: always() && github.event_name != 'pull_request' && hashFiles('orbit-baseline.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: orbit-baseline.json
          key: orbit-baseline-${{ github.run_id }}-${{ github.run_attempt }}

      # Runs even when the scan failed the build (exit 1), so findings still show up.
      # If the scan errored (exit 2) no report exists and the step is skipped by hashFiles.
      - name: Upload SARIF
        if: always() && hashFiles('orbit.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: orbit.sarif
