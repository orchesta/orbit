# Orbit dependency scan, Azure Pipelines step template.
#
#   steps:
#     - checkout: self
#     - template: ci/azure-pipelines/orbit-scan.yml   # or from a repository resource
#       parameters:
#         failOn: high
#         ignoreFile: ''   # optional, relative to path; empty uses <path>/.orbitignore
#         failOnKev: false
#         exploitData: true
#         baseline: false   # true: pull requests fail only on new findings (see below)
#         baselineBranch: refs/heads/main
#
# Publishes a JUnit test run ("Orbit") and a SARIF file as the "CodeAnalysisLogs"
# build artifact, then fails the job with the CLI's exit code (0 clean, 1 findings
# at or above failOn or, with failOnKev, in CISA KEV, or a malicious package unless
# failOn is none, 2 error). Only that last step decides the build result; a missing
# report just skips its publish step. Needs Azure DevOps Server 2020 or later (typed
# parameters; for Server 2019 convert `parameters:` to the untyped map form). Use the
# template once per job: it shares the ORBIT_* variables.
#
# failOnKev: true      also fails on any finding in CISA KEV; no catalog means
#                      exit 2. Only the first run gets it, the SARIF run never does.
# exploitData: false   passes --no-exploit-data: nothing goes to www.cisa.gov or
#                      api.first.org.
#
# useContainer: true   runs the CLI image with docker (Linux agents with Docker).
# useContainer: false  downloads the release binary and verifies it against checksums.txt
#                      (Linux, macOS and Windows agents, no Docker needed).
# Air-gapped: mirror the image and set imageName, or mirror the release assets and set
# binaryBaseUrl.
#
# baseline: true  Builds of baselineBranch also write orbit-baseline.json (one more scan) and
#                 publish it as the build artifact "orbit-baseline". Every finding there is an
#                 existing one, so exit 1 is reported as a warning and does not fail the build
#                 (not even for a malicious package or a KEV entry): the download below skips
#                 failed builds. Exit 2 still fails it, and so does a failed orbit-baseline.json
#                 scan: nothing is published and the previous good build keeps serving its
#                 baseline, while a passing build without it would leave pull requests with
#                 none. Other builds, pull requests included,
#                 download that artifact from the latest successful or partially succeeded build
#                 of baselineBranch in this pipeline and pass it to --baseline: they fail only on
#                 new findings and on malicious packages. With none yet the download step fails
#                 softly (continueOnError, the build shows as partially succeeded), a warning says
#                 so and every finding counts. Schedule a daily build of baselineBranch so new
#                 advisories are part of the baseline (see example.yml). Build artifacts are used
#                 because pipeline artifacts are not available on Azure DevOps Server.

parameters:
  - name: path
    type: string
    default: $(Build.SourcesDirectory)
  - name: failOn
    type: string
    default: high
  - name: ignoreFile
    type: string
    default: ''   # relative to path; empty uses <path>/.orbitignore when it exists
  - name: failOnKev
    type: boolean
    default: false   # true also fails on any finding in CISA KEV (no catalog: exit 2)
  - name: exploitData
    type: boolean
    default: true    # false passes --no-exploit-data: no www.cisa.gov, no api.first.org
  - name: version
    type: string
    default: latest   # a release tag such as v1.0.0; required (not "latest") when useContainer is false
  - name: useContainer
    type: boolean
    default: true
  - name: imageName
    type: string
    default: orchestalabs/orbit-cli
  - name: binaryBaseUrl
    type: string
    default: https://github.com/orchesta/orbit/releases/download
  - name: baseline
    type: boolean
    default: false   # true: pull requests fail only on findings baselineBranch does not have
  - name: baselineBranch
    type: string
    default: refs/heads/main   # full ref, as in Build.SourceBranch

steps:
  # ---- baseline (baseline: true) -----------------------------------------------------
  # Builds of baselineBranch record the baseline instead (see the scan steps).
  - ${{ if eq(parameters.baseline, true) }}:
      - task: DownloadBuildArtifacts@0
        displayName: Download Orbit baseline
        # not(canceled()), not succeeded(): the scan steps run after a failed earlier step
        # too (their conditions have no status function), so the download does as well.
        condition: and(not(canceled()), ne(variables['Build.SourceBranch'], '${{ parameters.baselineBranch }}'))
        continueOnError: true   # a first run has no baseline yet
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          pipeline: $(System.DefinitionId)
          buildVersionToDownload: latestFromBranch
          branchName: ${{ parameters.baselineBranch }}
          allowPartiallySucceededBuilds: true
          downloadType: single
          artifactName: orbit-baseline
          downloadPath: $(Agent.TempDirectory)

  # ---- container mode (Linux agents with Docker) -------------------------------------
  - ${{ if eq(parameters.useContainer, true) }}:
      - bash: |
          echo "##vso[task.logissue type=error]useContainer: true needs a Linux agent with Docker; set useContainer: false on ${AGENT_OS}."
          exit 1
        displayName: Orbit scan (unsupported agent)
        condition: ne(variables['Agent.OS'], 'Linux')
      - bash: |
          set -u
          reports="$AGENT_TEMPDIRECTORY/orbit-reports"
          mkdir -p "$reports"
          # Baseline mode: builds of the baseline branch record, all others compare. The
          # branch match ignores case, like the download step's condition.
          record=false
          baseline=""
          baseline_dir="$AGENT_TEMPDIRECTORY/orbit-baseline"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -n "${ORBIT_BASELINE_BRANCH:-}" ]; then
            if [ "$(lower "${BUILD_SOURCEBRANCH:-}")" = "$(lower "$ORBIT_BASELINE_BRANCH")" ]; then
              record=true
            elif [ -f "$baseline_dir/orbit-baseline.json" ]; then
              baseline=/baseline/orbit-baseline.json
            else
              echo "##vso[task.logissue type=warning]Orbit: no baseline was downloaded from $ORBIT_BASELINE_BRANCH;" \
                "every finding counts."
            fi
          fi
          # Arguments every run gets; the runs add their own after them.
          orbit_run() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$ORBIT_PATH":/src:ro -v "$reports":/out \
              ${baseline:+-v "$baseline_dir":/baseline:ro} \
              "$ORBIT_IMAGE:$ORBIT_VERSION" \
              scan --path /src ${ORBIT_NO_EXPLOIT_DATA:+--no-exploit-data} \
              ${ORBIT_IGNORE_FILE:+--ignore-file "/src/$ORBIT_IGNORE_FILE"} "$@"
          }
          rc=0
          orbit_run --fail-on "$ORBIT_FAIL_ON" ${ORBIT_FAIL_ON_KEV:+--fail-on-kev} \
            ${baseline:+--baseline "$baseline"} \
            --format junit --out /out/orbit-junit.xml || rc=$?
          if [ "$rc" -ne 2 ]; then
            # No --fail-on-kev in the runs below: they only write reports.
            orbit_run --fail-on none ${baseline:+--baseline "$baseline"} \
              --format sarif --out /out/orbit.sarif --quiet \
              || echo "warning: could not write orbit.sarif" >&2
            # A failed recording scan fails the build and publishes nothing, so the
            # download keeps taking the previous good build's baseline.
            if [ "$record" = true ] && ! orbit_run --fail-on none --format json --out /out/orbit-baseline.json --quiet; then
              echo "##vso[task.logissue type=error]Orbit: could not write orbit-baseline.json;" \
                "failing the build so the previous good build keeps serving its baseline."
              rm -f "$reports/orbit-baseline.json"
              rc=2
            fi
          fi
          # Only exit 1 (findings) is turned into a warning; exit 2 from either scan stays.
          if [ "$record" = true ] && [ "$rc" -eq 1 ]; then
            echo "##vso[task.logissue type=warning]Orbit: $ORBIT_BASELINE_BRANCH records the baseline;" \
              "its findings are reported and do not fail the build."
            rc=0
          fi
          [ -f "$reports/orbit-junit.xml" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_JUNIT]true"
          [ -f "$reports/orbit.sarif" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_SARIF]true"
          [ -f "$reports/orbit-baseline.json" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_BASELINE]true"
          echo "##vso[task.setvariable variable=ORBIT_EXIT]$rc"
          echo "##vso[task.setvariable variable=ORBIT_REPORTS]$reports"
        displayName: Orbit scan
        condition: eq(variables['Agent.OS'], 'Linux')
        env:
          ORBIT_PATH: ${{ parameters.path }}
          ORBIT_FAIL_ON: ${{ parameters.failOn }}
          ORBIT_IGNORE_FILE: ${{ parameters.ignoreFile }}
          ORBIT_VERSION: ${{ parameters.version }}
          ${{ if eq(parameters.failOnKev, true) }}:
            ORBIT_FAIL_ON_KEV: 'true'
          ${{ if eq(parameters.failOnKev, false) }}:
            ORBIT_FAIL_ON_KEV: ''
          ${{ if eq(parameters.exploitData, false) }}:
            ORBIT_NO_EXPLOIT_DATA: 'true'
          ${{ if eq(parameters.exploitData, true) }}:
            ORBIT_NO_EXPLOIT_DATA: ''
          ${{ if eq(parameters.baseline, true) }}:
            ORBIT_BASELINE_BRANCH: ${{ parameters.baselineBranch }}
          ${{ if eq(parameters.baseline, false) }}:
            ORBIT_BASELINE_BRANCH: ''
          ORBIT_IMAGE: ${{ parameters.imageName }}

  # ---- binary mode (no Docker) -------------------------------------------------------
  - ${{ if eq(parameters.useContainer, false) }}:
      # Linux and macOS agents
      - bash: |
          set -u
          if [ "$ORBIT_VERSION" = latest ]; then
            echo "##vso[task.logissue type=error]Binary mode needs a release tag in 'version' (for example v1.0.0)."
            exit 1
          fi
          # --- download-begin
          set -e
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)         asset="orbit_${ORBIT_VERSION}_linux_amd64" ;;
            Linux-aarch64|Linux-arm64) asset="orbit_${ORBIT_VERSION}_linux_arm64" ;;
            Darwin-x86_64)        asset="orbit_${ORBIT_VERSION}_darwin_amd64" ;;
            Darwin-arm64)         asset="orbit_${ORBIT_VERSION}_darwin_arm64" ;;
            *) echo "##vso[task.logissue type=error]No Orbit binary for $(uname -s) $(uname -m)"; exit 1 ;;
          esac
          bindir="$AGENT_TEMPDIRECTORY/orbit-bin"
          mkdir -p "$bindir"
          curl -fsSL --retry 3 -o "$bindir/$asset" "$ORBIT_BASE_URL/$ORBIT_VERSION/$asset"
          curl -fsSL --retry 3 -o "$bindir/checksums.txt" "$ORBIT_BASE_URL/$ORBIT_VERSION/checksums.txt"
          want="$(awk -v f="$asset" '{n=$2; sub(/^\*/, "", n); if (n == f) print $1}' "$bindir/checksums.txt")"
          if [ -z "$want" ]; then
            echo "##vso[task.logissue type=error]$asset is not listed in checksums.txt"; exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            got="$(sha256sum "$bindir/$asset" | awk '{print $1}')"
          else
            got="$(shasum -a 256 "$bindir/$asset" | awk '{print $1}')"
          fi
          if [ "$want" != "$got" ]; then
            echo "##vso[task.logissue type=error]Checksum mismatch for $asset (expected $want, got $got)"; exit 1
          fi
          chmod +x "$bindir/$asset"
          orbit="$bindir/$asset"
          # --- download-end
          set +e
          reports="$AGENT_TEMPDIRECTORY/orbit-reports"
          mkdir -p "$reports"
          # Baseline mode: builds of the baseline branch record, all others compare. The
          # branch match ignores case, like the download step's condition. No arrays:
          # macOS ships bash 3.2.
          record=false
          baseline=""
          baseline_file="$AGENT_TEMPDIRECTORY/orbit-baseline/orbit-baseline.json"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -n "${ORBIT_BASELINE_BRANCH:-}" ]; then
            if [ "$(lower "${BUILD_SOURCEBRANCH:-}")" = "$(lower "$ORBIT_BASELINE_BRANCH")" ]; then
              record=true
            elif [ -f "$baseline_file" ]; then
              baseline="$baseline_file"
            else
              echo "##vso[task.logissue type=warning]Orbit: no baseline was downloaded from $ORBIT_BASELINE_BRANCH;" \
                "every finding counts."
            fi
          fi
          # Arguments every run gets; the runs add their own after them.
          orbit_run() {
            "$orbit" scan --path "$ORBIT_PATH" ${ORBIT_NO_EXPLOIT_DATA:+--no-exploit-data} \
              ${ORBIT_IGNORE_FILE:+--ignore-file "$ORBIT_PATH/$ORBIT_IGNORE_FILE"} "$@"
          }
          orbit_run --fail-on "$ORBIT_FAIL_ON" ${ORBIT_FAIL_ON_KEV:+--fail-on-kev} \
            ${baseline:+--baseline "$baseline"} \
            --format junit --out "$reports/orbit-junit.xml"
          rc=$?
          if [ "$rc" -ne 2 ]; then
            # No --fail-on-kev in the runs below: they only write reports.
            orbit_run --fail-on none ${baseline:+--baseline "$baseline"} \
              --format sarif --out "$reports/orbit.sarif" --quiet \
              || echo "warning: could not write orbit.sarif" >&2
            # A failed recording scan fails the build and publishes nothing, so the
            # download keeps taking the previous good build's baseline.
            if [ "$record" = true ] && ! orbit_run --fail-on none --format json --out "$reports/orbit-baseline.json" --quiet; then
              echo "##vso[task.logissue type=error]Orbit: could not write orbit-baseline.json;" \
                "failing the build so the previous good build keeps serving its baseline."
              rm -f "$reports/orbit-baseline.json"
              rc=2
            fi
          fi
          # Only exit 1 (findings) is turned into a warning; exit 2 from either scan stays.
          if [ "$record" = true ] && [ "$rc" -eq 1 ]; then
            echo "##vso[task.logissue type=warning]Orbit: $ORBIT_BASELINE_BRANCH records the baseline;" \
              "its findings are reported and do not fail the build."
            rc=0
          fi
          [ -f "$reports/orbit-junit.xml" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_JUNIT]true"
          [ -f "$reports/orbit.sarif" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_SARIF]true"
          [ -f "$reports/orbit-baseline.json" ] && echo "##vso[task.setvariable variable=ORBIT_HAS_BASELINE]true"
          echo "##vso[task.setvariable variable=ORBIT_EXIT]$rc"
          echo "##vso[task.setvariable variable=ORBIT_REPORTS]$reports"
        displayName: Orbit scan
        condition: in(variables['Agent.OS'], 'Linux', 'Darwin')
        env:
          ORBIT_PATH: ${{ parameters.path }}
          ORBIT_FAIL_ON: ${{ parameters.failOn }}
          ORBIT_IGNORE_FILE: ${{ parameters.ignoreFile }}
          ORBIT_VERSION: ${{ parameters.version }}
          ${{ if eq(parameters.failOnKev, true) }}:
            ORBIT_FAIL_ON_KEV: 'true'
          ${{ if eq(parameters.failOnKev, false) }}:
            ORBIT_FAIL_ON_KEV: ''
          ${{ if eq(parameters.exploitData, false) }}:
            ORBIT_NO_EXPLOIT_DATA: 'true'
          ${{ if eq(parameters.exploitData, true) }}:
            ORBIT_NO_EXPLOIT_DATA: ''
          ${{ if eq(parameters.baseline, true) }}:
            ORBIT_BASELINE_BRANCH: ${{ parameters.baselineBranch }}
          ${{ if eq(parameters.baseline, false) }}:
            ORBIT_BASELINE_BRANCH: ''
          ORBIT_BASE_URL: ${{ parameters.binaryBaseUrl }}
      # Windows agents (Windows PowerShell 5.1 or later; no pwsh install needed)
      - powershell: |
          $ErrorActionPreference = 'Stop'
          $version = $env:ORBIT_VERSION
          if ($version -eq 'latest') {
            Write-Host "##vso[task.logissue type=error]Binary mode needs a release tag in 'version' (for example v1.0.0)."
            exit 1
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $asset = "orbit_${version}_windows_amd64.exe"
          $bindir = Join-Path $env:AGENT_TEMPDIRECTORY 'orbit-bin'
          New-Item -ItemType Directory -Force -Path $bindir | Out-Null
          $exe = Join-Path $bindir $asset
          $sums = Join-Path $bindir 'checksums.txt'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "$($env:ORBIT_BASE_URL)/$version/$asset" -OutFile $exe
          Invoke-WebRequest -UseBasicParsing -Uri "$($env:ORBIT_BASE_URL)/$version/checksums.txt" -OutFile $sums
          $want = $null
          foreach ($line in Get-Content $sums) {
            $parts = $line -split '\s+', 2
            if ($parts.Count -eq 2 -and $parts[1].TrimStart('*') -eq $asset) { $want = $parts[0]; break }
          }
          if (-not $want) {
            Write-Host "##vso[task.logissue type=error]$asset is not listed in checksums.txt"
            exit 1
          }
          $got = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
          if ($want.ToLowerInvariant() -ne $got.ToLowerInvariant()) {
            Write-Host "##vso[task.logissue type=error]Checksum mismatch for $asset (expected $want, got $got)"
            exit 1
          }
          $ErrorActionPreference = 'Continue'
          $reports = Join-Path $env:AGENT_TEMPDIRECTORY 'orbit-reports'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $ignoreArgs = @()
          if ($env:ORBIT_IGNORE_FILE) { $ignoreArgs = @('--ignore-file', (Join-Path $env:ORBIT_PATH $env:ORBIT_IGNORE_FILE)) }
          $exploitArgs = @()
          if ($env:ORBIT_NO_EXPLOIT_DATA) { $exploitArgs = @('--no-exploit-data') }
          $kevArgs = @()
          if ($env:ORBIT_FAIL_ON_KEV) { $kevArgs = @('--fail-on-kev') }
          # Baseline mode: builds of the baseline branch record, all others compare. -eq
          # ignores case, like the download step's condition.
          $record = $false
          $baseArgs = @()
          $baselineFile = Join-Path (Join-Path $env:AGENT_TEMPDIRECTORY 'orbit-baseline') 'orbit-baseline.json'
          if ($env:ORBIT_BASELINE_BRANCH) {
            if ($env:BUILD_SOURCEBRANCH -eq $env:ORBIT_BASELINE_BRANCH) {
              $record = $true
            } elseif (Test-Path -LiteralPath $baselineFile -PathType Leaf) {
              $baseArgs = @('--baseline', $baselineFile)
            } else {
              Write-Host "##vso[task.logissue type=warning]Orbit: no baseline was downloaded from $($env:ORBIT_BASELINE_BRANCH); every finding counts."
            }
          }
          & $exe scan --path $env:ORBIT_PATH --fail-on $env:ORBIT_FAIL_ON @ignoreArgs @exploitArgs @kevArgs @baseArgs --format junit --out (Join-Path $reports 'orbit-junit.xml')
          $rc = $LASTEXITCODE
          if ($rc -ne 2) {
            # No @kevArgs in the runs below: they only write reports.
            & $exe scan --path $env:ORBIT_PATH --fail-on none @ignoreArgs @exploitArgs @baseArgs --format sarif --out (Join-Path $reports 'orbit.sarif') --quiet
            if ($LASTEXITCODE -ne 0) { Write-Host 'warning: could not write orbit.sarif' }
            # A failed recording scan fails the build and publishes nothing, so the
            # download keeps taking the previous good build's baseline.
            if ($record) {
              & $exe scan --path $env:ORBIT_PATH --fail-on none @ignoreArgs @exploitArgs --format json --out (Join-Path $reports 'orbit-baseline.json') --quiet
              if ($LASTEXITCODE -ne 0) {
                Write-Host ('##vso[task.logissue type=error]Orbit: could not write orbit-baseline.json; ' +
                  'failing the build so the previous good build keeps serving its baseline.')
                Remove-Item -LiteralPath (Join-Path $reports 'orbit-baseline.json') -Force -ErrorAction SilentlyContinue
                $rc = 2
              }
            }
          }
          # Only exit 1 (findings) is turned into a warning; exit 2 from either scan stays.
          if ($record -and $rc -eq 1) {
            Write-Host ("##vso[task.logissue type=warning]Orbit: $($env:ORBIT_BASELINE_BRANCH) records the baseline; " +
              'its findings are reported and do not fail the build.')
            $rc = 0
          }
          if (Test-Path (Join-Path $reports 'orbit-junit.xml')) { Write-Host '##vso[task.setvariable variable=ORBIT_HAS_JUNIT]true' }
          if (Test-Path (Join-Path $reports 'orbit.sarif')) { Write-Host '##vso[task.setvariable variable=ORBIT_HAS_SARIF]true' }
          if (Test-Path (Join-Path $reports 'orbit-baseline.json')) { Write-Host '##vso[task.setvariable variable=ORBIT_HAS_BASELINE]true' }
          Write-Host "##vso[task.setvariable variable=ORBIT_EXIT]$rc"
          Write-Host "##vso[task.setvariable variable=ORBIT_REPORTS]$reports"
          exit 0
        displayName: Orbit scan
        condition: eq(variables['Agent.OS'], 'Windows_NT')
        env:
          ORBIT_PATH: ${{ parameters.path }}
          ORBIT_FAIL_ON: ${{ parameters.failOn }}
          ORBIT_IGNORE_FILE: ${{ parameters.ignoreFile }}
          ORBIT_VERSION: ${{ parameters.version }}
          ${{ if eq(parameters.failOnKev, true) }}:
            ORBIT_FAIL_ON_KEV: 'true'
          ${{ if eq(parameters.failOnKev, false) }}:
            ORBIT_FAIL_ON_KEV: ''
          ${{ if eq(parameters.exploitData, false) }}:
            ORBIT_NO_EXPLOIT_DATA: 'true'
          ${{ if eq(parameters.exploitData, true) }}:
            ORBIT_NO_EXPLOIT_DATA: ''
          ${{ if eq(parameters.baseline, true) }}:
            ORBIT_BASELINE_BRANCH: ${{ parameters.baselineBranch }}
          ${{ if eq(parameters.baseline, false) }}:
            ORBIT_BASELINE_BRANCH: ''
          ORBIT_BASE_URL: ${{ parameters.binaryBaseUrl }}

  # ---- publish (always, so findings are visible even when the build fails) -----------
  - task: PublishTestResults@2
    displayName: Publish Orbit results (JUnit)
    condition: and(always(), eq(variables['ORBIT_HAS_JUNIT'], 'true'))
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: orbit-junit.xml
      searchFolder: $(ORBIT_REPORTS)
      testRunTitle: Orbit
      failTaskOnFailedTests: false   # the CLI exit code decides, in the last step

  # "CodeAnalysisLogs" is the artifact name the SARIF SAST Scans Tab extension reads.
  # Azure DevOps Server may not have that extension; the JUnit run above works everywhere.
  - task: PublishBuildArtifacts@1
    displayName: Publish Orbit SARIF
    condition: and(always(), eq(variables['ORBIT_HAS_SARIF'], 'true'))
    inputs:
      PathtoPublish: $(ORBIT_REPORTS)/orbit.sarif
      ArtifactName: CodeAnalysisLogs

  # The baseline other builds download (written only on baselineBranch).
  - ${{ if eq(parameters.baseline, true) }}:
      - task: PublishBuildArtifacts@1
        displayName: Publish Orbit baseline
        condition: and(always(), eq(variables['ORBIT_HAS_BASELINE'], 'true'))
        inputs:
          PathtoPublish: $(ORBIT_REPORTS)/orbit-baseline.json
          ArtifactName: orbit-baseline

  # ---- fail the build with the CLI's exit code ---------------------------------------
  - bash: |
      echo "##vso[task.logissue type=error]Orbit scan exited with code ${ORBIT_EXIT}"
      exit "$ORBIT_EXIT"
    displayName: Orbit scan result
    condition: and(always(), in(variables['Agent.OS'], 'Linux', 'Darwin'), ne(variables['ORBIT_EXIT'], ''), ne(variables['ORBIT_EXIT'], '0'))
  - powershell: |
      Write-Host "##vso[task.logissue type=error]Orbit scan exited with code $env:ORBIT_EXIT"
      exit [int]$env:ORBIT_EXIT
    displayName: Orbit scan result
    condition: and(always(), eq(variables['Agent.OS'], 'Windows_NT'), ne(variables['ORBIT_EXIT'], ''), ne(variables['ORBIT_EXIT'], '0'))
