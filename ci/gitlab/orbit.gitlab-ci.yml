# Orbit dependency scan for GitLab CI.
#
# Use it from your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/orchesta/orbit/v1.0.0/ci/gitlab/orbit.gitlab-ci.yml'
#
#   variables:
#     ORBIT_VERSION: v1.0.0   # image tag; pin it, the template default is latest
#     ORBIT_FAIL_ON: high     # optional: critical|high|medium|low|unknown|none
#     ORBIT_IGNORE_FILE: ""   # optional: empty = <path>/.orbitignore when present
#     ORBIT_PATH: ""          # optional: directory to scan, default $CI_PROJECT_DIR
#     ORBIT_FAIL_ON_KEV: "false"  # optional: "true" also fails on any finding in CISA KEV
#     ORBIT_EXPLOIT_DATA: "true"  # optional: "false" sends nothing to www.cisa.gov or api.first.org
#     ORBIT_BASELINE: ""      # optional: "" off, "auto", or a path to an earlier orbit JSON report
#     ORBIT_BASELINE_JOB: ""  # optional, auto: job whose orbit-baseline.json is used (default: this job's name)
#
# Variables you set in your own .gitlab-ci.yml (top level or on the job) override the
# template, because the template only declares ORBIT_VERSION at its top level (needed for
# the image tag) and applies every other default inside the script with ${VAR:-default}.
# Do not copy defaults into a job-level `variables:` of your own unless you mean to
# override them.
#
# Or extend the hidden job to customise it:
#
#   orbit-scan:
#     extends: .orbit-scan
#     variables:
#       ORBIT_FAIL_ON: critical
#
# Two reports are written, one scan each:
#   orbit-junit.xml  shown in the merge request test report, run with ORBIT_FAIL_ON
#   orbit.sarif      kept as a job artifact, run with --fail-on none
# Why two runs and not "JSON once, convert with jq": the CLI image (alpine based) has no
# jq, and installing it at job time would add another network dependency. A second run is
# one extra osv.dev round trip. The second run downloads the KEV catalog and EPSS scores
# again (about 200 KB).
# Only the first run decides the job result, so the job fails at most once.
#
# Baseline (ORBIT_BASELINE: auto): merge requests fail only on findings that are new compared
# with the default branch, and on malicious packages; all findings are still reported.
#   - On the default branch (not a merge request pipeline) the job also writes
#     orbit-baseline.json, one more scan, and keeps it as an artifact. Every finding there is
#     an existing one, so exit 1 is reported as a warning but does not fail the job (not even
#     for a malicious package or a KEV entry): GitLab hands out artifacts only from the
#     latest successful pipeline of a branch. Exit 2 still fails it, and so does a failed
#     orbit-baseline.json scan: a passing job without the file would become the latest
#     successful pipeline and leave merge requests without a baseline, while a failed job
#     leaves the previous pipeline's baseline in place.
#   - Everywhere else the job downloads orbit-baseline.json of the latest successful pipeline
#     of the merge request's target branch (the default branch otherwise) through the job
#     artifacts API with CI_JOB_TOKEN, and passes it to --baseline. This works on every tier;
#     needs:project is not used. With no baseline yet (a first run, or a target branch that
#     never recorded one) it warns and every finding counts.
#   - The API looks only at the latest successful pipeline of that branch. If that pipeline
#     did not run the orbit job (rules skipped it, or it ran other jobs only), the download
#     gets a 404, and the job warns as above.
#   - GitLab may answer the download with a redirect to object storage or a CDN. busybox
#     wget follows it and sends the JOB-TOKEN header there as well. The token is scoped to
#     this job and expires with it. On self-managed GitLab use an https CI_API_V4_URL and,
#     with object storage, proxy_download so artifacts are served by GitLab itself.
#   - GitLab keeps the artifacts of each branch's latest successful pipeline regardless of
#     expire_in ("Keep artifacts from most recent successful jobs", on by default).
#   - Merge request pipelines that run in a fork download from the fork's own pipelines.
#   - Schedule a default-branch pipeline (for example daily) so advisories published since
#     the last merge are part of the baseline.
# Any other ORBIT_BASELINE value is a path to a report you provide; it is passed to
# --baseline as is, and a missing file is an error (exit 2).
# Every job that does not record (the default mode, and auto outside the default branch)
# logs "orbit-baseline.json: no matching files" when it uploads artifacts. That is
# expected: the path is listed for the recording job.

variables:
  ORBIT_VERSION: latest   # pin to a release tag such as v1.0.0

.orbit-scan:
  image:
    name: orchestalabs/orbit-cli:$ORBIT_VERSION
    entrypoint: [""]
    # The image runs as uid 10001, which cannot write to the checkout GitLab creates
    # as root. Run as root inside the throwaway container so reports can be written.
    # image:docker:user works with the Docker and Kubernetes executors and needs a
    # recent GitLab (and Runner). If yours is too old, use a derived image with
    # `USER root` instead.
    docker:
      user: "0"
  script:
    - |
      path="${ORBIT_PATH:-$CI_PROJECT_DIR}"
      fail_on="${ORBIT_FAIL_ON:-high}"
      case "${ORBIT_FAIL_ON_KEV:-false}" in
        true) kev_flag="--fail-on-kev" ;;
        false) kev_flag="" ;;
        *) echo "error: ORBIT_FAIL_ON_KEV must be true or false, got '$ORBIT_FAIL_ON_KEV'" >&2; exit 2 ;;
      esac
      case "${ORBIT_EXPLOIT_DATA:-true}" in
        true) exploit_flag="" ;;
        false) exploit_flag="--no-exploit-data" ;;
        *) echo "error: ORBIT_EXPLOIT_DATA must be true or false, got '$ORBIT_EXPLOIT_DATA'" >&2; exit 2 ;;
      esac
      baseline=""
      record=false
      case "${ORBIT_BASELINE:-}" in
        "") ;;
        auto)
          if [ -z "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${CI_COMMIT_BRANCH:-}" ] \
            && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
            record=true
          else
            ref="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
            job="${ORBIT_BASELINE_JOB:-$CI_JOB_NAME}"
            urlenc() {
              printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/ /%20/g' -e 's|/|%2F|g' -e 's/#/%23/g' \
                -e 's/?/%3F/g' -e 's/&/%26/g' -e 's/+/%2B/g'
            }
            prev="${TMPDIR:-/tmp}/orbit-baseline.prev.json"
            url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$(urlenc "$ref")"
            url="$url/raw/orbit-baseline.json?job=$(urlenc "$job")"
            if wget -q -T 60 --header "JOB-TOKEN: $CI_JOB_TOKEN" -O "$prev" "$url"; then
              baseline="$prev"
            else
              rm -f "$prev"
              echo "warning: no Orbit baseline from the latest successful $ref pipeline" \
                "(job $job); every finding counts" >&2
            fi
          fi
          ;;
        *) baseline="$ORBIT_BASELINE" ;;
      esac
      rc=0
      orbit scan --path "$path" --fail-on "$fail_on" $kev_flag $exploit_flag \
        ${ORBIT_IGNORE_FILE:+--ignore-file "$ORBIT_IGNORE_FILE"} \
        ${baseline:+--baseline "$baseline"} \
        --format junit --out orbit-junit.xml || rc=$?
      # Exit 2 is an error (osv.dev unreachable, timeout, bad flag, bad baseline, or no KEV
      # catalog with ORBIT_FAIL_ON_KEV): no report was written and another run would most
      # likely fail the same way.
      if [ "$rc" -ne 2 ]; then
        # No --fail-on-kev in the runs below: they only write artifacts.
        orbit scan --path "$path" --fail-on none $exploit_flag \
          ${ORBIT_IGNORE_FILE:+--ignore-file "$ORBIT_IGNORE_FILE"} \
          ${baseline:+--baseline "$baseline"} \
          --format sarif --out orbit.sarif --quiet \
          || echo "warning: could not write orbit.sarif" >&2
        # A failed recording scan fails the job: a passing job without the file would
        # become the latest successful pipeline, and merge requests would find no
        # baseline. A failed one leaves the previous pipeline's baseline in place.
        if [ "$record" = true ] && ! orbit scan --path "$path" --fail-on none $exploit_flag \
            ${ORBIT_IGNORE_FILE:+--ignore-file "$ORBIT_IGNORE_FILE"} \
            --format json --out orbit-baseline.json --quiet; then
          echo "error: could not write orbit-baseline.json; failing the job so the previous" \
            "successful pipeline keeps serving its baseline" >&2
          rm -f orbit-baseline.json
          rc=2
        fi
      fi
      # Only exit 1 (findings) is turned into a warning; exit 2 from either scan stays.
      if [ "$record" = true ] && [ "$rc" -eq 1 ]; then
        echo "warning: Orbit findings are reported in orbit-junit.xml but do not fail the job:" \
          "$CI_DEFAULT_BRANCH records the baseline" >&2
        rc=0
      fi
      # Keep the first run's exit code: 0 clean, 1 findings at or above the threshold, a
      # malicious package (unless the threshold is none), or in KEV with ORBIT_FAIL_ON_KEV
      # (with a baseline only new findings count, and malicious packages even when it lists
      # them), 2 error.
      # The default branch in baseline mode turns 1 into 0 and a failed recording scan
      # into 2, see above.
      exit "$rc"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - orbit.sarif
      - orbit-baseline.json
    reports:
      junit: orbit-junit.xml

orbit-scan:
  extends: .orbit-scan
  stage: test
